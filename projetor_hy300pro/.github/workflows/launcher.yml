name: Launcher Cinema (APK)

on:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/launcher.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Renomear APK
        run: |
          versao=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "cinema-launcher-${versao}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: cinema-launcher
          path: launcher/cinema-launcher-*.apk
